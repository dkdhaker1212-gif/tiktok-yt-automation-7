# THE channel config. Loaded and validated by src/config.py.
# One entry per channel. This repo hosts exactly one.

channels:
  - id: channel_7                         # unique; used in DB, logs, secret names
    tiktok_username: "mr..unclog8"        # no @  -- satisfying storm-drain / culvert unclogging, huge water release. 103K followers / 1.3M likes, pure TikTok-native (no YouTube channel -> no reused-content claim risk). Swapped in from the dead "WOODVORA" DIY-weapons source (0 subs / 0 views after 6 vids, off-niche + weapon-policy risk).
    youtube_channel_name: "Drain Rush"
    owner_email: "frt763147@gmail.com"

    google_credentials_file: "credentials/channel_7_client_secret.json"
    oauth_token_file: "tokens/channel_7_token.json"

    videos_per_day: 1
    description_footer: ""
    default_tags: [unclogging, drain unclogging, satisfying, oddly satisfying, storm drain,
                   culvert cleaning, drain cleaning, unclog, water flow, flooded road,
                   clogged drain, asmr cleaning, satisfying cleaning, mud, debris removal,
                   drainage, cleanup, satisfying video, before and after, so satisfying]
    youtube_category_id: "24"             # 24 Entertainment (oddly-satisfying / broad reach)
    enabled: true
    max_retry_days: 7
    shorts_max_seconds: 180
    min_video_seconds: 12                 # skip clips shorter than 12s
    max_video_seconds: 175                # keep it in Shorts range
    upload_mode: popular_only             # always pick the most-viewed unposted video
    max_download_candidates: 20

    use_ai_seo: true
    edit:
      enabled: true
      zoom_crop_pct: 3.0
      speed: 1.03
      hflip: false
      fade_seconds: 0.25
      sharpen: true
      denoise: false
      saturation: 1.06
      contrast: 1.05
      loudnorm: true
      volume_gain_db: 0.0
      blur_regions: []
      hook_caption:                    # burned-in hook, first 3s (retention + transformation)
        enabled: true
        seconds: 3
        position: top
        size_pct: 5.6
      brand_overlay:                     # small corner mark = the channel's own logo
        enabled: true
        image: "assets/brand_badge.png"
        corner: tr
        width_pct: 10
        margin_pct: 3
        opacity: 0.92

    thumbnail:
      enabled: true
      hook_source: title
      position: bottom
      accent_rgb: [56, 160, 220]
      hook_templates:
        - "WATCH IT DRAIN"
        - "IT ALL RUSHED OUT"
        - "SO SATISFYING"
        - "FINALLY UNBLOCKED"

    slot_publish_times_utc:               # this IS the cron fire time
      1: "17:00"                          # 1:00 PM US Eastern = 10:30 PM IST
